# Oikeustapausseurannan lähteet ja suodatussäännöt.
# Lisää tai poista lähteitä vapaasti. Koodia ei tarvitse muuttaa.
#
# Lähteet on ryhmitelty samoihin lukuihin kuin kuukausittainen
# tietosuojauutiskirje, jotta kattavuutta on helppo verrata.

settings:
  # Kuinka monta päivää taaksepäin feedissä näytetään.
  window_days: 120
  # Montako juttua enintään yhdelle sivulle.
  max_items: 200
  # Sivun otsikko ja omistaja.
  site_title: "Data Protection Newsfeed"
  site_subtitle: "Tietosuoja, teknologia ja datasääntely"
  timezone: "Europe/Helsinki"

# Avainsanat ratkaisevat, mikä pääsee feediin.
# must_any: ainakin yksi näistä pitää osua otsikkoon, tiivistelmään tai
#           asiasanoihin. Jos lista on tyhjä, kaikki pääsevät läpi.
# boost:    nostaa jutun "tärkeä" -luokkaan (näkyy sivulla korostettuna).
# never:    pudottaa jutun pois, vaikka must_any osuisi.
keywords:
  must_any:
    # --- tietosuoja ---
    - tietosuoja
    - henkilötiet
    - yksityiselämän suoja
    - GDPR
    - "2016/679"
    - rekisterinpitäj
    - henkilötietojen käsittelij
    - tietosuojavaltuutet
    - tietoturvaloukkaus
    - profilointi
    - automaattinen päätöksenteko
    - vaikutustenarviointi
    - seuraamusmaksu
    - biometri
    - evästeet
    - verkkojäljit
    # Viestintäsalaisuus on perusoikeus eikä telemarkkinasääntelyä, joten se
    # jää tietosuojalohkoon vaikka muu sähköisen viestinnän termistö poistui.
    - viestintäsalaisuu
    # --- datasääntely ---
    # Pelkkä sana "tekoäly" on poistettu tarkoituksella. Se osui jokaiseen
    # ministeriön ja viraston tiedotteeseen, jossa mainittiin chatbotti tai
    # kyberharjoitus, ja boost-listalla ollessaan se nosti ne vielä
    # "tärkeä"-luokkaan. Tilalle jäivät vain sääntelyyn viittaavat ilmaukset,
    # joten tekoälyasetusta koskevat jutut tulevat edelleen mukaan.
    - "2024/1689"
    - AI Act
    - tekoälyasetus
    - data act
    - datasäädös
    - datan hallinnointi
    - digipalvelusäädös
    - digimarkkinasäädös
    - DSA
    - DMA
    - alustasääntely
    - digitaalinen identiteetti
    - eIDAS
    # --- kyberturvallisuus ---
    - kyberturvallisuus
    - kyberhyökkäy
    - kyberkestävyy
    - NIS2
    - NIS 2
    - verkko- ja tietoturvadirektiivi
    - haavoittuvuus
    - tietomurto
    - tietojenkalastelu
    - huijausviesti
    - palvelunestohyökkäys
    - kiristyshaittaohjelma
    # --- englanti ---
    - personal data
    - data protection
    - privacy
    - cyber
    - data governance
  boost:
    - tietosuojavaltuutet
    - hallinnollinen seuraamusmaksu
    - seuraamusmaksu
    - "2016/679"
    - "2024/1689"
    - tietoturvaloukkaus
    - tietomurto
    - biometri
  never:
    - avoin työpaikka
    - rekrytointi
    - vuosikertomus
    - toimintakertomus
    - puhelinneuvonta
    - kirjaamo suljettu
    - organisaatio uudistuu
    - stakeholder event
    - save the date
    - webinaari
    # Traficomin ja ministeriöiden palveluilmoitukset
    - käyttökatko
    - huoltokatko
    - ei ole käytettävissä
    - podcast

# Aiheluokat sivun suodatusnappeihin. Juttu saa kaikki ne luokat, joiden
# termeistä vähintään yksi osuu otsikkoon, asiasanoihin tai tiivistelmään.
# Sama juttu voi kuulua useaan luokkaan, koska esimerkiksi tekoälypäätös
# on usein myös tietosuojapäätös. Jos mikään ei osu, juttu jää ilman
# aihetunnistetta ja näkyy vain silloin kun aihesuodatus on pois päältä.
topics:
  Tietosuoja:
    - tietosuoja
    - henkilötiet
    - gdpr
    - "2016/679"
    - rekisterinpitäj
    - henkilötietojen käsittelij
    - seuraamusmaksu
    - profilointi
    - biometri
    - evästeet
    - verkkojäljit
    - vaikutustenarviointi
    - yksityiselämän suoja
    # Viestintäsalaisuus on perusoikeus, joten se kuuluu tietosuojaluokkaan.
    # Muu sähköisen viestinnän termistö poistui omana luokkanaan, koska se
    # nosti esiin telemarkkinointia ja kuluttajasopimuksia.
    - viestintäsalaisuu
    - personal data
    - data protection
    - privacy
  Kyberturvallisuus:
    - kyber
    - cyber
    - nis2
    - nis 2
    - verkko- ja tietoturvadirektiivi
    - haavoittuvuus
    - tietomurto
    - tietoturvaloukkaus
    - tietojenkalastelu
    - huijausviesti
    - palvelunestohyökkäys
    - kiristyshaittaohjelma
  Datasääntely:
    - data act
    - datasäädös
    - datan hallinnointi
    - digipalvelusäädös
    - digimarkkinasäädös
    - dsa
    - dma
    - alustasääntely
    - data governance
    # Tekoäly ei ole enää oma luokkansa, koska pelkkä sana osui jokaiseen
    # chatbottitiedotteeseen. Tekoälyasetus on sääntelyä, joten sen
    # tunnisteet ovat täällä ja AI Act -jutut saavat edelleen aihetunnisteen.
    - tekoälyasetus
    - ai act
    - "2024/1689"
  Digitaalinen identiteetti:
    - eidas
    - digitaalinen identiteetti

sources:
  # ===================================================================
  # Luku 1 ja 2: KKO ja KHO
  # ===================================================================
  # Kaikki oikeusasteet luetaan tuomioistuimet.fi:n ratkaisusivuilta
  # (https://www.tuomioistuimet.fi/tuomioistuinten-ratkaisut/) eikä enää
  # kunkin tuomioistuimen omasta WordPress-syötteestä. Syy on asiasanat:
  # ratkaisukortilla on tuomioistuimen itsensä antama luettelo, esimerkiksi
  # "Tietosuoja – Asiakirjajulkisuus – Asiakastietolaki", ja se osuu
  # avainsanasuodatukseen selvästi tarkemmin kuin RSS-syötteen pelkkä
  # otsikko. Linkit osoittavat samaan URL-osoitteeseen kuin vanhat syötteet,
  # joten mikään ei tule mukaan kahteen kertaan.
  #
  # Sivuilta puuttuu käräjäoikeus tarkoituksella: tuomioistuimet.fi ei
  # julkaise käräjäoikeuksien ratkaisuja tällä listalla lainkaan. Nämä
  # seitsemän ovat siis kaikki oikeusasteet paitsi käräjäoikeus.
  - id: kko-ratkaisut
    name: "Korkeimman oikeuden ennakkopäätökset"
    type: court_rulings
    court: "KKO"
    weight: 3
    url: "https://www.tuomioistuimet.fi/tuomioistuinten-ratkaisut/korkeimman-oikeuden-ennakkopaatokset/"

  - id: kho-ratkaisut
    name: "Korkeimman hallinto-oikeuden ennakkopäätökset"
    type: court_rulings
    court: "KHO"
    weight: 3
    url: "https://www.tuomioistuimet.fi/tuomioistuinten-ratkaisut/korkeimman-hallinto-oikeuden-ennakkopaatokset/"

  # ===================================================================
  # Luku 3 ja 4: hovioikeudet ja erityistuomioistuimet
  # ===================================================================
  # Yksittäisillä hovioikeuksilla, hallinto-oikeuksilla ja käräjäoikeuksilla
  # ei ole omaa syötettä. Vanhat oikeus.fi-osoitteet vastaavat nykyään 404,
  # joten ne on korvattu tuomioistuinlaitoksen yhteisellä
  # ajankohtaissyötteellä. Se kattaa kaikkien näiden tiedotteet samassa
  # virrassa. court_patterns lukee otsikosta mikä oikeusaste on kyseessä
  # (esim. "Turun hallinto-oikeuden viikolla..." -> "Hallinto-oikeus") ja
  # käyttää sitä jutun oikeusastetunnisteena "Tuomioistuimet"-yleisnimen
  # sijaan, jotta sivun oikeusaste-suodattimesta löytyy myös
  # "Hallinto-oikeus", "Hovioikeus" ja "Käräjäoikeus" omina nappeinaan.
  # Jos mikään näistä ei osu (esim. KKO/KHO/vakuutusoikeus mainitaan
  # samassa syötteessä), juttu pitää court-kentän oletusarvon.
  - id: tuomioistuimet
    name: "Tuomioistuinlaitos"
    type: plain_rss
    court: "Tuomioistuimet"
    weight: 2
    url: "https://www.tuomioistuimet.fi/feed/rss-feed?post_type=ajankohtaiset"
    # Sanavartalot ilman taivutuspäätettä (sama periaate kuin yllä olevan
    # keywords-lohkon must_any-listalla), koska otsikoissa esiintyy sekä
    # nominatiivi ("hovioikeus hylkäsi...") että genetiivi
    # ("hovioikeuden ratkaisu..."), eikä "hovioikeus" osu jälkimmäiseen.
    # "Korkein hallinto-oikeus" tarkistetaan ennen yleistä hallinto-oikeus-
    # sääntöä, ettei KHO:ta koskeva juttu putoa väärin alueellisen
    # hallinto-oikeuden koriin.
    court_patterns:
      - match: ["korkei", "hallinto-oikeu"]
        label: "KHO"
      - match: ["korkei", "oikeu"]
        label: "KKO"
      - match: ["hovioikeu"]
        label: "Hovioikeus"
      - match: ["hallinto-oikeu"]
        label: "Hallinto-oikeus"
      - match: ["käräjäoikeu"]
        label: "Käräjäoikeus"

  # Alemmat oikeusasteet ja erityistuomioistuimet samalta ratkaisusivustolta.
  - id: hao-ratkaisut
    name: "Hallinto-oikeuksien ratkaisut"
    type: court_rulings
    court: "Hallinto-oikeus"
    weight: 2
    url: "https://www.tuomioistuimet.fi/tuomioistuinten-ratkaisut/hallinto-oikeuksien-ratkaisut/"

  - id: hovi-ratkaisut
    name: "Hovioikeuksien ratkaisut"
    type: court_rulings
    court: "Hovioikeus"
    weight: 2
    url: "https://www.tuomioistuimet.fi/tuomioistuinten-ratkaisut/hovioikeuksien-ratkaisut/"

  - id: mao-ratkaisut
    name: "Markkinaoikeuden ratkaisut"
    type: court_rulings
    court: "MAO"
    weight: 2
    url: "https://www.tuomioistuimet.fi/tuomioistuinten-ratkaisut/markkinaoikeuden-ratkaisut/"

  - id: tt-ratkaisut
    name: "Työtuomioistuimen ratkaisut"
    type: court_rulings
    court: "TT"
    weight: 1
    url: "https://www.tuomioistuimet.fi/tuomioistuinten-ratkaisut/tyotuomioistuimen-ratkaisut/"

  - id: vako-ratkaisut
    name: "Vakuutusoikeuden ratkaisut"
    type: court_rulings
    court: "VakO"
    weight: 1
    url: "https://www.tuomioistuimet.fi/tuomioistuinten-ratkaisut/vakuutusoikeuden-ratkaisut/"

  # ===================================================================
  # Luku 5: EU-tuomioistuin ja EU:n säädösvalmistelu
  # ===================================================================
  - id: eu-courts
    name: "Unionin tuomioistuin (EUT ja unionin yleinen tuomioistuin)"
    type: eu_sparql
    court: "EUT"
    weight: 3
    # CJ = tuomio (EUT), TJ = tuomio (yleinen tuomioistuin),
    # CC = julkisasiamiehen ratkaisuehdotus.
    celex_types: ["CJ", "TJ", "CC"]
    language: "fin"
    lookback_days: 150
    # Haku hakee KAIKKI unionin tuomioistuimen ratkaisut aihealueesta
    # riippumatta ja luottaa sen jälkeen pelkkään must_any-suodatukseen.
    # Ongelma: EUT:n asiasanateksti on lyhyt oikeudellinen tiivistelmä, jossa
    # yleiset hallinto-oikeuden sanat kuten "seuraamusmaksu" esiintyvät myös
    # esim. liikenne- tai kilpailuoikeuden ratkaisuissa. Esimerkki: C-437/25
    # koski kuljettajakortin väärinkäytöstä määrättyä kiinteämääräistä
    # seuraamusmaksua (asetus 165/2014, tieliikenne), ei tietosuojaa, mutta
    # pelkkä sana "seuraamusmaksu" riitti läpäisemään must_any-listan.
    # require_any on tätä varten oleva lähdekohtainen lisäsuodatin: jutun
    # pitää osua johonkin näistä tarkemmista termeistä, ennen kuin se edes
    # pääsee yleisen must_any-listan arvioitavaksi. Listasta on tietoisesti
    # jätetty pois yleiset hallinto-oikeuden sanat (seuraamusmaksu,
    # liikesalaisuu, vaikutustenarviointi, julkisuuslaki), koska ne osuvat
    # yhtä hyvin muihinkin oikeudenaloihin.
    require_any:
      - tietosuoja
      - henkilötiet
      - yksityiselämän suoja
      - gdpr
      - "2016/679"
      - rekisterinpitäj
      - tietosuojavaltuutet
      - tietoturvaloukkaus
      - profilointi
      - automaattinen päätöksenteko
      - biometri
      - evästeet
      - verkkojäljit
      # Sähköisen viestinnän yleiset termit on poistettu. Ne päästivät läpi
      # esimerkiksi asian C-669/24, joka koski teleoperaattorin
      # kuluttajasopimuksen muutosta eikä henkilötietoja lainkaan. Pelkkä
      # "tekoäly" on poistettu samasta syystä, mutta tekoälyasetuksen
      # tunnisteet ovat jäljellä.
      - viestintäsalaisuu
      - "2024/1689"
      - ai act
      - tekoälyasetus
      - data act
      - datasäädös
      - datan hallinnointi
      - digipalvelusäädös
      - digimarkkinasäädös
      - dsa
      - dma
      - alustasääntely
      - digitaalinen identiteetti
      - eidas
      - kyberturvallisuus
      - kyberhyökkäy
      - kyberkestävyy
      - nis2
      - nis 2
      - tietomurto
      - personal data
      - data protection
      - privacy
      - cyber
      - data governance

  - id: curia-press
    name: "Unionin tuomioistuimen lehdistötiedotteet"
    type: plain_rss
    court: "EUT"
    weight: 1
    optional: true
    url: "https://curia.europa.eu/site/rss.jsp?lang=en&secondLang=fr"

  - id: ec-digital
    name: "Komissio, digitaalinen strategia"
    type: plain_rss
    court: "EU-komissio"
    weight: 2
    url: "https://digital-strategy.ec.europa.eu/en/rss.xml"

  # Parlamentin lehdistötiedotteet kertovat missä vaiheessa säädöshankkeet
  # ovat. Palvelin torjuu tuntemattoman asiakasohjelman vastaamalla
  # koodilla 202 ja tyhjällä rungolla, joten browser: true on pakollinen.
  - id: ep
    name: "Euroopan parlamentti, lehdistötiedotteet"
    type: plain_rss
    court: "EP"
    weight: 1
    browser: true
    url: "https://www.europarl.europa.eu/rss/doc/press-releases/en.xml"

  # ===================================================================
  # Luku 6: kansalliset säädösmuutokset ja esityöt
  # ===================================================================
  # Finlexillä ei ole avointa rajapintaa. api.finlex.fi vastaa 401 ja
  # opendata.finlex.fi 403, joten säädökset luetaan listasivun HTML:stä.
  # Listasivulla ei ole päivämääriä ja säädöksiä on vuodessa yli 800, joten
  # hakija suodattaa ensin otsikosta ja hakee julkaisupäivän vasta jäljelle
  # jääneiden säädösten omilta sivuilta. require_any on siis tehokkuutta
  # varten, ei korvaa keywords.must_any -suodatusta.
  #
  # Eduskunnan avoin data (VaskiData) palauttaa raakaa XML:ää ilman
  # päivämääräsaraketta, joten se ei sovellu tähän suoraan. Hallituksen
  # esitykset tulevat sen sijaan Finlexin omasta osastosta.
  - id: finlex-sk
    name: "Finlex, säädöskokoelma"
    type: finlex
    court: "Säädöskokoelma"
    weight: 3
    browser: true
    url: "https://www.finlex.fi/fi/lainsaadanto/saadoskokoelma/2026"
    lookback_days: 120
    max_detail: 30
    require_any: &saadosaiheet
      - tietosuoja
      - henkilötiet
      - tietojen käsittely
      - tiedonhallin
      - kyberturvallisuu
      - tietoturva
      - sähköisen viestinnän
      - tekoäly
      - digitaalis
      - tunnistus
      - tietoliikenne
      - verkkotunnus
      - julkisuudesta
      - rekisteri
      - tietojärjestelm
      - data

  - id: finlex-he
    name: "Finlex, hallituksen esitykset"
    type: finlex
    court: "HE"
    weight: 2
    browser: true
    url: "https://www.finlex.fi/fi/hallituksen-esitykset/2026"
    lookback_days: 150
    max_detail: 20
    require_any: *saadosaiheet

  - id: vn
    name: "Valtioneuvosto"
    type: html_list
    court: "VN"
    weight: 2
    optional: true
    url: "https://valtioneuvosto.fi/ajankohtaista"
    link_pattern: "valtioneuvosto\\.fi/-/"

  - id: om
    name: "Oikeusministeriö"
    type: html_list
    court: "OM"
    weight: 2
    optional: true
    url: "https://oikeusministerio.fi/ajankohtaista"
    link_pattern: "oikeusministerio\\.fi/-/"

  # Liikenne- ja viestintäministeriö poistettiin seurannasta, koska sen
  # tiedotteet käsittelevät liikennepolitiikkaa ja teletoimintaa eivätkä
  # tietosuojaa. Viestintäsääntelyn tietosuojapuoli tulee Traficomilta ja
  # tietosuojavaltuutetun toimistolta.
  - id: tem
    name: "Työ- ja elinkeinoministeriö"
    type: plain_rss
    court: "TEM"
    weight: 1
    optional: true
    url: "https://tem.fi/etusivu/-/asset_publisher/PuQeVCwBv2KT/rss"

  # Valtiovarainministeriö poistettiin seurannasta. Sen syöte on valtaosin
  # budjetti- ja verotiedotteita, ja tiedonhallintalain muutokset tulevat
  # joka tapauksessa Finlexin säädöskokoelmasta ja HE-osastosta.

  # ===================================================================
  # Luku 7: tietosuojaviranomaiset
  # ===================================================================
  # 7.1 Tietosuojavaltuutetun toimisto. Liferayn asset_publisher -syöte
  # antaa oikeat päivämäärät, toisin kuin ajankohtaissivun raapiminen.
  # Toimisto käsittelee pelkkää tietosuojaa, joten avainsanasuodatus
  # ohitetaan (always_include).
  - id: tsv
    name: "Tietosuojavaltuutetun toimisto"
    type: plain_rss
    court: "TSV"
    weight: 3
    always_include: true
    url: "https://tietosuoja.fi/etusivu/-/asset_publisher/GcYqYm2ssJIz/rss"

  # 7.2 Traficom. Ei RSS-syötettä, ja ajankohtaissivu piirtyy osin
  # selaimessa, joten osumia tulee vain muutama kerrallaan.
  - id: traficom
    name: "Traficom"
    type: html_list
    court: "Traficom"
    weight: 2
    optional: true
    url: "https://www.traficom.fi/fi/ajankohtaista"
    link_pattern: "traficom\\.fi/fi/(uutiset|tiedotteet)/"

  # 7.3 Kansainväliset. EDPB:n syöte kattaa uutiset ja ohjeet.
  - id: edpb
    name: "Euroopan tietosuojaneuvosto (EDPB)"
    type: plain_rss
    court: "EDPB"
    weight: 2
    always_include: true
    url: "https://www.edpb.europa.eu/rss.xml"

  # EDPS:n oma uutissivu on JavaScript-haasteen takana: se vastaa koodilla
  # 202 ja lähes tyhjällä rungolla myös selaimen tunnisteella. Etusivu
  # aukeaa, joten nostot luetaan sieltä. Saalis on pieni mutta oikea.
  - id: edps
    name: "Euroopan tietosuojavaltuutettu (EDPS)"
    type: html_list
    court: "EDPS"
    weight: 2
    optional: true
    browser: true
    always_include: true
    url: "https://www.edps.europa.eu/_en"
    link_pattern: "(/press-publications/press-news/(blog|news|press-releases)/|/our-work/publications/(opinions|techdispatch)/\\d{4}-)"
    strip_title_prefix: "^Read more about\\s*"
    min_title_len: 25
    never_any:
      - "read the press release"
      - "read the opinion"

  # Puolan tietosuojaviranomainen julkaisee englanniksi ja tekee
  # poikkeuksellisen paljon valvontapäätöksiä, joten se on hyvä mittari
  # siitä mihin suuntaan eurooppalainen valvontakäytäntö kehittyy.
  - id: uodo
    name: "Puolan tietosuojaviranomainen (UODO)"
    type: html_list
    court: "UODO"
    weight: 1
    optional: true
    browser: true
    always_include: true
    url: "https://uodo.gov.pl/en"
    # Osasto 553 on uutiset. Etusivulla on lisäksi ohjesivuja osastoissa
    # 664, 665 ja 666 ("What rights does the GDPR give you?"). Ne ovat
    # pysyvää ohjeistusta ilman päivämäärää, joten ne rajataan pois.
    link_pattern: "uodo\\.gov\\.pl/en/553/\\d+"
    min_title_len: 25
    # Etusivun asettelu vaihtelee, ja joskus 553-suodatuksesta huolimatta
    # ohjesivuja pääsee läpi. Ne tunnistaa siitä, että sivun "Check"-nappi
    # liimautuu otsikkotekstin perään ("... designate a DPO? Check").
    # Oikea uutinen ei koskaan pääty tähän sanaan, joten tämä on turvallinen
    # toinen suojakerros link_patternin lisäksi.
    never_any:
      - "check"

  # ===================================================================
  # Luku 8: oikeudelliset julkaisut (väitöskirjat ja opinnäytteet)
  # ===================================================================
  # Yliopistojen julkaisuarkistot puhuvat OAI-PMH:ta. Arkistot sisältävät
  # kaikkien tieteenalojen aineiston, joten rajauksia on kaksi:
  # type_contains jättää muun kuin opinnäyte- ja artikkeliaineiston pois ja
  # require_any vaatii lisäksi oikeustieteellisen kytkennän. Ilman
  # jälkimmäistä feediin valuu esimerkiksi tekoälyä käsittelevät
  # kauppatieteen ja tietotekniikan gradut.
  #
  # Huomaa kaksi eri osoitemuotoa. DSpace 7 tarjoaa OAI:n polusta
  # /server/oai/request, vanhemmat asennukset polusta /oai/request.
  - id: helda
    name: "Helda (Helsingin yliopisto)"
    type: oai_pmh
    court: "Julkaisu"
    weight: 1
    optional: true
    url: "https://helda.helsinki.fi/server/oai/request"
    lookback_days: 75
    max_pages: 5
    type_contains: &julkaisutyypit

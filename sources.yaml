  # ===================================================================
  # Luku 9: muut uutiset ja järjestöjen julkaisut
  # ===================================================================
  # Edilex uutisoi säädösmuutokset ja uudet ratkaisut samana päivänä, joten
  # se toimii varmistuksena sille että mikään ei mene ohi. Otsikon edessä
  # on kellonaika muodossa "18.9.2026 16.00", joka siivotaan pois.
  - id: edilex
    name: "Edilex, uutiset"
    type: html_list
    court: "Edilex"
    weight: 2
    optional: true
    browser: true
    url: "https://www.edilex.fi/uutiset"
    link_pattern: "edilex\\.fi/uutiset/\\d+"
    strip_title_prefix: "^\\d{1,2}\\.\\d{1,2}\\.\\d{4}\\s+\\d{1,2}\\.\\d{2}\\s*"

  # IAPP on alan kansainvälinen kattojärjestö. Listasivu ei kerro
  # julkaisupäivää missään muodossa, joten se haetaan juttujen omilta
  # sivuilta (detail_date). Ilman sitä kaikki IAPP:n jutut saisivat
  # hakupäivän ja jäisivät feedin kärkeen viikoksi.
  - id: iapp
    name: "IAPP"
    type: html_list
    court: "IAPP"
    weight: 1
    optional: true
    browser: true
    url: "https://iapp.org/news/"
    link_pattern: "iapp\\.org/news/a/"
    min_title_len: 25
    detail_date: true
    max_detail: 25

  - id: asianajajat
    name: "Suomen Asianajajaliitto"
    type: plain_rss
    court: "Asianajajaliitto"
    weight: 1
    optional: true
    url: "https://asianajajat.fi/feed/"

  # ===================================================================
  # Luku 10: kyberturvallisuus
  # ===================================================================
  - id: kyberturva
    name: "Kyberturvallisuuskeskus"
    type: plain_rss
    court: "Kyberturvallisuuskeskus"
    # Paino 1, koska haavoittuvuustiedotteita tulee paljon ja ne eivät saa
    # nousta saman päivän oikeudellisten juttujen edelle.
    weight: 1
    url: "https://www.kyberturvallisuuskeskus.fi/feed/rss/fi"
    # Yksittäiset tuotehaavoittuvuustiedotteet pois. Ne ovat ylläpidon asia,
    # eivät oikeudellinen kysymys, ja niitä tulee niin paljon että ne peittivät
    # alleen kaiken muun. Viikkokatsaus, Kybersää ja kyberkestävyyssäädöstä
    # koskevat jutut jäävät, koska niissä ei ole näitä ilmauksia.
    never_any:
      - "kriittinen haavoittuvuus"
      - "kriittisiä haavoittuvuuksia"
      - "aktiivisesti hyväksikäytetty"
      - "hae rahoitustukea"

  - id: enisa-news
    name: "ENISA, uutiset"
    type: html_list
    court: "ENISA"
    weight: 1
    optional: true
    url: "https://www.enisa.europa.eu/news"
    link_pattern: "enisa\\.europa\\.eu/news/"

  - id: enisa-pubs
    name: "ENISA, julkaisut"
    type: html_list
    court: "ENISA"
    weight: 1
    optional: true
    url: "https://www.enisa.europa.eu/publications"
    link_pattern: "enisa\\.europa\\.eu/publications/"

  # Sisäministeriö poistettiin seurannasta. Sen tiedotteet koskevat
  # pääosin maahanmuuttoa, pelastustointa ja poliisin toimivaltuuksia,
  # eivät tietosuojaa. Kyberturvallisuuspuoli tulee Kybertuvallisuuskeskuk-
  # selta, Traficomilta ja ENISA:lta.

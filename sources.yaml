      - säädös
      - tuomioistuin
      - legal
      - jurisprudence
      - regulation
      - GDPR
      - tietosuoja

  # Helsingin yliopiston oikeustieteellisen tiedekunnan oma kokoelma omana
  # lähteenään, jotta tiedekunnan julkaisut eivät jää yllä olevan laajan
  # haun sattuman varaan. Kokoelman verkko-osoitteessa näkyvä UUID
  # 59639589-499c-4e56-8090-1c6a6a2daa8f ei ole sama asia kuin OAI:n
  # setSpec, vaan se pitää kääntää kokoelman handlen kautta: REST-rajapinta
  # /server/api/core/collections/<uuid> antaa handlen 10138/18071, ja siitä
  # setSpec muodostuu muotoon col_10138_18071.
  #
  # Tässä ei ole require_any-rajausta, koska koko kokoelma on jo
  # oikeustieteellinen ja yleinen must_any-suodatus hoitaa aiherajauksen.
  # Lookback on pidempi kuin muilla, koska väitöskirjoja ja artikkeleita
  # ilmestyy harvakseltaan.
  - id: helda-oikeustiede
    name: "Helda, oikeustieteellinen tiedekunta"
    type: oai_pmh
    court: "Julkaisu"
    weight: 1
    optional: true
    url: "https://helda.helsinki.fi/server/oai/request"
    oai_set: "col_10138_18071"
    lookback_days: 120
    max_pages: 5
    type_contains: *julkaisutyypit

